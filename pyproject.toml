[project]
name = "sideron"
version = "3.4.0-rc.1"
description = "SIDERON - System for Intelligent Dialogue, Execution, Reasoning, Operations and Navigation"
requires-python = ">=3.12"

dependencies = [
    "psutil>=6.0",
    "pycaw",
    "sounddevice",
    "numpy",
    "python-dotenv",
    "openai[realtime]"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

packaging = [
    "pyinstaller>=6.15"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
